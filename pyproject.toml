[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vtdb"
version = "0.1.0"
description = "Convert Vivado report_timing_summary text reports into SQLite for querying"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "euphgh" }]
keywords = ["vivado", "timing", "sqlite", "fpga", "eda"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Embedded Systems",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/euphgh/vtdb"
Repository = "https://github.com/euphgh/vtdb"
Issues = "https://github.com/euphgh/vtdb/issues"

[project.scripts]
vtdb = "vtdb.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vtdb = ["schema.sql"]
